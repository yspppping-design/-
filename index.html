<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>我的小樹洞</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=ZCOOL+KuaiLe&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  :root {
    --bg-0: #14121f;
    --bg-1: #1c1a2e;
    --bg-2: #272442;
    --pink: #ffd6ec;
    --purple: #c9b8ff;
    --yellow: #fff3a1;
    --text: #fff7ff;
    --muted: #b6b0d4;
    --line: rgba(255,255,255,0.12);
  }
  body {
    min-height: 100vh;
    font-family: "ZCOOL KuaiLe", "Microsoft JhengHei", sans-serif;
    background:
      radial-gradient(circle at 20% 10%, rgba(201,184,255,0.25), transparent 26%),
      radial-gradient(circle at 80% 20%, rgba(255,214,236,0.18), transparent 28%),
      radial-gradient(circle at 50% 90%, rgba(255,243,161,0.12), transparent 30%),
      linear-gradient(180deg, #11101c 0%, #1a1830 100%);
    color: var(--text);
    overflow-x: hidden;
    position: relative;
  }
  .firefly {
    position: fixed;
    left: 0; top: 0;
    width: 5px; height: 5px;
    border-radius: 50%;
    background: #fff7c2;
    box-shadow: 0 0 10px 3px rgba(255,247,194,0.75);
    pointer-events: none;
    animation: fly 14s infinite ease-in-out;
    z-index: 1;
  }
  @keyframes fly {
    0% { transform: translate(0,0); opacity: 0.2; }
    25% { opacity: 0.9; }
    50% { transform: translate(90px,-110px); opacity: 0.35; }
    75% { opacity: 0.85; }
    100% { transform: translate(-40px,60px); opacity: 0.2; }
  }
  .deco {
    position: fixed;
    font-size: 22px;
    opacity: 0.35;
    pointer-events: none;
    animation: fall linear infinite;
    z-index: 1;
  }
  @keyframes fall {
    0% { transform: translateY(-10vh) rotate(0); }
    100% { transform: translateY(110vh) rotate(360deg); }
  }
  #lockScreen {
    position: fixed; inset: 0;
    background: rgba(10,9,18,0.92);
    display: flex; align-items: center; justify-content: center;
    z-index: 1000;
  }
  .lock-box {
    width: min(92%, 360px);
    padding: 34px 28px;
    border-radius: 28px;
    background: linear-gradient(145deg, rgba(255,214,236,0.14), rgba(201,184,255,0.14));
    border: 1px solid var(--line);
    text-align: center;
  }
  .lock-box h2 {
    font-size: 28px;
    letter-spacing: 2px;
    margin-bottom: 8px;
    color: var(--yellow);
  }
  .lock-box p { color: var(--muted); margin-bottom: 18px; }
  #pwdInput {
    width: 100%;
    padding: 12px 14px;
    border-radius: 16px;
    border: 1px solid var(--line);
    background: rgba(255,255,255,0.06);
    color: var(--text);
    font-size: 16px;
    outline: none;
  }
  #enterBtn {
    margin-top: 14px;
    padding: 10px 22px;
    border-radius: 999px;
    border: none;
    background: linear-gradient(135deg, #ff9ed4, #b39bff);
    color: white;
    font-size: 15px;
    cursor: pointer;
  }
  #enterBtn:hover { filter: brightness(1.1); }
  .tip { margin-top: 10px; font-size: 12px; color: var(--muted); }
  #main {
    display: none;
    position: relative;
    z-index: 2;
    max-width: 780px;
    margin: 0 auto;
    padding: 28px 18px 40px;
  }
  header {
    text-align: center;
    padding-bottom: 18px;
    border-bottom: 1px dashed var(--line);
    margin-bottom: 24px;
  }
  header h1 {
    font-size: 32px;
    letter-spacing: 3px;
    color: var(--yellow);
  }
  header p { color: var(--muted); margin-top: 6px; }
  .card {
    background: linear-gradient(145deg, rgba(255,255,255,0.06), rgba(255,255,255,0.02));
    border: 1px solid var(--line);
    border-radius: 24px;
    padding: 20px;
    margin-bottom: 22px;
  }
  .card h3 {
    margin-bottom: 12px;
    color: var(--pink);
  }
  .music-box audio {
    width: 100%;
    border-radius:16px;
  }
  textarea {
    width: 100%;
    min-height: 120px;
    padding: 14px;
    border-radius: 18px;
    border: 1px solid var(--line);
    background: rgba(255,255,255,0.06);
    color: var(--text);
    font-size: 16px;
    outline: none;
    resize: vertical;
  }
  .row {
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
    align-items: center;
    margin-top: 12px;
  }
  .mood-tags { display: flex; flex-wrap: wrap; gap: 8px; }
  .tag {
    padding: 6px 12px;
    border-radius: 999px;
    border: 1px solid var(--line);
    background: rgba(255,255,255,0.04);
    color: var(--muted);
    cursor: pointer;
    font-size: 14px;
  }
  .tag.active {
    background: linear-gradient(135deg, #ff9ed4, #b39bff);
    color: white;
    border-color: transparent;
  }
  .btn {
    padding: 10px 18px;
    border-radius: 999px;
    border: none;
    cursor: pointer;
    font-size: 15px;
  }
  .btn-primary {
    background: linear-gradient(135deg, #ff9ed4, #b39bff);
    color: white;
  }
  .draw-area {
    background: rgba(255,255,255,0.04);
    border-radius: 20px;
    padding: 14px;
  }
  .tools {
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
    align-items: center;
    margin-bottom: 10px;
  }
  .tools label { color: var(--muted); font-size: 14px; }
  input[type="color"] {
    width: 36px; height: 30px;
    border: none;
    background: transparent;
    cursor: pointer;
  }
  input[type="range"] { width: 120px; }
  canvas {
    width: 100%;
    height: 240px;
    background: #110f22;
    border-radius: 16px;
    border: 1px solid var(--line);
    display: block;
    cursor: crosshair;
  }
  .trash-area {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 14px;
    text-align: center;
  }
  .trash-input {
    width: 100%;
    min-height: 90px;
    padding: 14px;
    border-radius: 18px;
    border: 1px solid var(--line);
    background: rgba(255,255,255,0.06);
    color: var(--text);
    outline: none;
    resize: vertical;
  }
  .trash-can {
    position: relative;
    width: 110px;
    height: 140px;
    cursor: pointer;
    transition: transform 0.2s;
  }
  .trash-can:hover { transform: scale(1.06) rotate(-2deg); }
  .trash-can.opening { transform: scale(1.12) rotate(-4deg); }
  .trash-svg { width: 100%; height: 100%; }
  .floating-note {
    position: fixed;
    min-width: 120px;
    max-width: 70%;
    padding: 12px 14px;
    background: #fff8c7;
    color: #4a3a10;
    border-radius: 14px;
    box-shadow: 0 8px 24px rgba(0,0,0,0.35);
    font-size: 14px;
    z-index: 2000;
    animation: dropIn 1.8s ease-in forwards;
    pointer-events: none;
  }
  @keyframes dropIn {
    0% { transform: translateY(-40vh) rotate(-12deg); opacity: 0; }
    60% { opacity: 1; }
    100% { transform: translateY(110vh) rotate(12deg); opacity: 0; }
  }
  .timeline-title {
    font-size: 20px;
    margin: 10px 0 14px;
    color: var(--yellow);
  }
  .note-item {
    background: rgba(255,255,255,0.05);
    border-left: 4px solid var(--purple);
    border-radius: 0 20px 20px 0;
    padding: 16px;
    margin-bottom: 14px;
  }
  .note-time { color: var(--muted); font-size: 13px; margin-bottom: 6px; }
  .note-mood {
    display: inline-block;
    padding: 4px 10px;
    border-radius: 999px;
    background: rgba(255,158,212,0.25);
    color: #ffd1ec;
    font-size: 13px;
    margin-bottom: 8px;
  }
  .note-content { line-height: 1.7; white-space: pre-line; }
  .del-btn {
    margin-top: 10px;
    font-size: 13px;
    color: var(--muted);
    cursor: pointer;
  }
  .del-btn:hover { color: #ff9ec2; }
  @media (max-width: 520px) {
    header h1 { font-size: 26px; }
    .card { padding: 16px; }
    canvas { height: 200px; }
  }
</style>
</head>
<body>
<div id="fireWrap"></div>
<div id="decoWrap"></div>
<div id="lockScreen">
  <div class="lock-box">
    <h2>我的小樹洞</h2>
    <p>把心事輕輕放進來吧</p>
    <input id="pwdInput" type="password" placeholder="輸入密碼" />
    <br />
    <button id="enterBtn" class="btn btn-primary">推門進去</button>
    <div class="tip">預設密碼：anpu</div>
  </div>
</div>
<div id="main">
  <header>
    <h1>我的小樹洞</h1>
    <p>深夜、螢火蟲、安溥的歌，還有一個只屬於你的地方。</p>
  </header>
  <section class="card music-box">
    <h3> 安溥 - 寶貝</h3>
    <audio controls>
      <source src="https://cdn.pixabay.com/download/audio/audio_63721208.mp3" type="audio/mpeg">
      你的瀏覽器不支援音樂播放
  </section>
  <section class="card">
    <h3> 寫下心情</h3>
    <textarea id="noteInput" placeholder="今天的你，是什麼顏色的呢？"></textarea>
    <div class="row">
      <div class="mood-tags">
        <span class="tag" data-mood="平靜">平靜</span>
        <span class="tag" data-mood="開心">開心</span>
        <span class="tag" data-mood="難過">難過</span>
        <span class="tag" data-mood="迷茫">迷茫</span>
        <span class="tag" data-mood="想念">想念</span>
      </div>
      <button id="saveBtn" class="btn btn-primary">存進樹洞</button>
    </div>
  </section>
  <section class="card">
    <h3> 隨手畫畫</h3>
    <div class="draw-area">
      <div class="tools">
        <label>顏色</label>
        <input type="color" id="colorPicker" value="#ffd6ec" />
        <label>粗細</label>
        <input type="range" id="lineWidth" min="1" max="14" value="3" />
        <button class="btn btn-primary" id="clearCanvas">擦掉重畫</button>
        <button class="btn btn-primary" id="saveDrawing">保存畫畫</button>
      </div>
      <canvas id="drawCanvas"></canvas>
    </div>
  </section>
  <section class="card">
    <h3> 把煩惱丟掉</h3>
    <div class="trash-area">
      <textarea id="trashInput" class="trash-input" placeholder="寫下你的煩惱，然後丟進垃圾桶……"></textarea>
      <div class="trash-can" id="trashCan" title="點我丟掉煩惱">
        <svg class="trash-svg" viewBox="0 0 110 140" xmlns="http://www.w3.org/2000/svg">
          <rect x="10" y="18" width="90" height="14" rx="6" fill="#7a6b9d"/>
          <rect x="22" y="8" width="66" height="12" rx="6" fill="#9b8bd1"/>
          <path d="M20 36 L90 36 L84 122 Q84 130 76 130 L34 130 Q26 130 26 122 Z" fill="#c9b8ff"/>
          <path d="M20 36 L90 36 L86 80 L24 80 Z" fill="#b39bff"/>
          <rect x="34" y="50" width="42" height="6" rx="3" fill="#fff3a1"/>
          <rect x="34" y="66" width="42" height="6" rx="3" fill="#ffd6ec"/>
          <rect x="46" y="2" width="18" height="10" rx="4" fill="#9b8bd1"/>
          <circle cx="42" cy="92" r="4" fill="#2b2550"/>
          <circle cx="68" cy="92" r="4" fill="#2b2550"/>
          <circle cx="43" cy="90" r="1.4" fill="white"/>
          <circle cx="69" cy="90" r="1.4" fill="white"/>
          <path d="M44 102 Q55 110 66 102" stroke="#2b2550" stroke-width="3" fill="none" stroke-linecap="round"/>
        </svg>
      </div>
      <p style="color:var(--muted);font-size:14px;">點擊垃圾桶，把煩惱丟進去吧。</p>
    </div>
  </section>
  <h3 class="timeline-title"> 樹洞碎片</h3>
  <div id="noteList"></div>
</div>
<script>
const PASSWORD = "anpu";
const fireWrap = document.getElementById('fireWrap');
for (let i = 0; i < 24; i++) {
  const f = document.createElement('div');
  f.className = 'firefly';
  f.style.left = Math.random() * 100 + 'vw';
  f.style.top = Math.random() * 100 + 'vh';
  f.style.animationDelay = Math.random() * 10 + 's';
  f.style.animationDuration = (10 + Math.random() * 8) + 's';
  fireWrap.appendChild(f);
}
const decoWrap = document.getElementById('decoWrap');
const decoSymbols = ['', '✨', '⭐', ''];
for (let i = 0; i < 10; i++) {
  const d = document.createElement('div');
  d.className = 'deco';
  d.textContent = decoSymbols[Math.floor(Math.random() * decoSymbols.length)];
  d.style.left = Math.random() * 100 + 'vw';
  d.style.animationDuration = (18 + Math.random() * 18) + 's';
  d.style.animationDelay = Math.random() * 10 + 's';
  decoWrap.appendChild(d);
}
const lockScreen = document.getElementById('lockScreen');
const main = document.getElementById('main');
const pwdInput = document.getElementById('pwdInput');
const enterBtn = document.getElementById('enterBtn');
enterBtn.onclick = ()=>{
  if(pwdInput.value === PASSWORD){
    lockScreen.style.display = 'none';
    main.style.display = 'block';
    renderNotes();
  }else{
    alert("密碼不對哦");
  }
}
pwdInput.onkeydown = e=>{if(e.key==='Enter') enterBtn.click();}
const tags = document.querySelectorAll('.tag');
let selectedMood = null;
tags.forEach(tag=>{
  tag.onclick = ()=>{
    tags.forEach(t=>t.classList.remove('active'));
    tag.classList.add('active');
    selectedMood = tag.dataset.mood;
  }
})
const noteInput = document.getElementById('noteInput');
const saveBtn = document.getElementById('saveBtn');
const noteList = document.getElementById('noteList');
function saveNote(){
  const content = noteInput.value.trim();
  if(!content){alert("寫點什麼再存進樹洞吧。");return;}
  const notes = JSON.parse(localStorage.getItem('treehole_notes') || '[]');
  notes.unshift({
    type: 'text',
    content,
    mood: selectedMood || '未標註',
    time: new Date().toLocaleString('zh-TW')
  });
  localStorage.setItem('treehole_notes',JSON.stringify(notes));
  noteInput.value = '';
  selectedMood = null;
  tags.forEach(t=>t.classList.remove('active'));
  renderNotes();
}
saveBtn.onclick = saveNote;
const canvas = document.getElementById('drawCanvas');
const ctx = canvas.getContext('2d');
const colorPicker = document.getElementById('colorPicker');
const lineWidth = document.getElementById('lineWidth');
const clearCanvas = document.getElementById('clearCanvas');
const saveDrawing = document.getElementById('saveDrawing');
function resizeCanvas(){
  const rect = canvas.getBoundingClientRect();
  const ratio = window.devicePixelRatio || 1;
  canvas.width = rect.width * ratio;
  canvas.height = 240 * ratio;
  ctx.scale(ratio,ratio);
  ctx.lineCap = 'round';
  ctx.lineJoin = 'round';
}
resizeCanvas();
window.addEventListener('resize',resizeCanvas);
let drawing = false;
function getPoint(e){
  const rect = canvas.getBoundingClientRect();
  const clientX = e.touches ? e.touches[0].clientX : e.clientX;
  const clientY = e.touches ? e.touches[0].clientY : e.clientY;
  return {x:clientX - rect.left, y:clientY - rect.top};
}
function startDraw(e){
  drawing = true;
  const p = getPoint(e);
  ctx.beginPath();
  ctx.moveTo(p.x,p.y);
}
function draw(e){
  if(!drawing) return;
  const p = getPoint(e);
  ctx.lineTo(p.x,p.y);
  ctx.strokeStyle = colorPicker.value;
  ctx.lineWidth = lineWidth.value;
  ctx.stroke();
}
function endDraw(){drawing = false;}
canvas.addEventListener('mousedown',startDraw);
canvas.addEventListener('mousemove',draw);
canvas.addEventListener('mouseup',endDraw);
canvas.addEventListener('mouseleave',endDraw);
canvas.addEventListener('touchstart',startDraw);
canvas.addEventListener('touchmove',draw);
canvas.addEventListener('touchend',endDraw);
clearCanvas.onclick = ()=>ctx.clearRect(0,0,canvas.width,canvas.height);
saveDrawing.onclick = ()=>{
  const dataUrl = canvas.toDataURL('image/png');
  const notes = JSON.parse(localStorage.getItem('treehole_notes') || '[]');
  notes.unshift({type:'drawing',image:dataUrl,time:new Date().toLocaleString('zh-TW')});
  localStorage.setItem('treehole_notes',JSON.stringify(notes));
  renderNotes();
  alert('畫畫已經存進樹洞啦。');
}
const trashCan = document.getElementById('trashCan');
const trashInput = document.getElementById('trashInput');
function dropTrash(){
  const text = trashInput.value.trim();
  if(!text){alert('先寫下你的煩惱吧。');return;}
  const note = document.createElement('div');
  note.className = 'floating-note';
  note.textContent = text;
  note.style.left = (Math.random()*60+20)+'vw';
  note.style.top = '-40px';
  document.body.appendChild(note);
  trashCan.classList.add('opening');
  setTimeout(()=>trashCan.classList.remove('opening'),400);
  setTimeout(()=>{note.remove();trashInput.value='';alert('煩惱已經被風帶走啦。');},1800);
}
trashCan.onclick = dropTrash;
function renderNotes(){
  const notes = JSON.parse(localStorage.getItem('treehole_notes') || '[]');
  noteList.innerHTML = '';
  notes.forEach((item,idx)=>{
    const div = document.createElement('div');
    div.className = 'note-item';
    if(item.type==='drawing'){
      div.innerHTML = `
        <div class="note-time">${item.time}</div>
        <img src="${item.image}" style="width:100%;border-radius:16px;margin-top:8px;" />
        <div class="del-btn" data-idx="${idx}">刪除這張畫</div>
      `
    }else{
      div.innerHTML = `
        <div class="note-time">${item.time}</div>
        <span class="note-mood">${item.mood}</span>
        <div class="note-content">${item.content}</div>
        <div class="del-btn" data-idx="${idx}">刪除這條心情</div>
      `
    }
    noteList.appendChild(div);
  })
  document.querySelectorAll('.del-btn').forEach(btn=>{
    btn.onclick = e=>{
      const i = e.target.dataset.idx;
      const arr = JSON.parse(localStorage.getItem('treehole_notes') || '[]');
      arr.splice(i,1);
      localStorage.setItem('treehole_notes',JSON.stringify(arr));
      renderNotes();
    }
  })
}
</script>
</body>
</html>
